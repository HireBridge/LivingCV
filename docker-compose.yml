name: portfolio

# Per-service memory caps + log rotation (optimize.md O4).
#
# Total ~960 MB reserved; the 1 GB free-tier box keeps the remaining ~40 MB
# for OS + dockerd. If a single service leaks, only its slice is OOM-killed
# instead of taking the whole box down.
#
# Container logs are bounded at 3 × 10 MB per service via the json-file
# driver — without this a runaway logger can eat the disk over months.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    <<: *logging
    environment:
      # Bare domain → automatic HTTPS; ":80" (default) → plain HTTP for local.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  web:
    # GHCR image is used on the box at deploy time (docker compose pull). The
    # `build:` block stays as the local-dev fallback for `docker compose build`
    # without a registry round-trip.
    image: ghcr.io/mohith-das/livingcv-web:latest
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    mem_limit: 384m
    <<: *logging
    environment:
      DATA_DIR: /data/db
      PORTFOLIO_ENCRYPTION_KEY: ${PORTFOLIO_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      JOBOPS_AUTH_TOKEN: ${JOBOPS_AUTH_TOKEN}
      IP_HASH_SALT: ${IP_HASH_SALT}
      ORCHESTRATOR_URL: http://orchestrator:8100
      # Cap V8 heap below the container's cgroup limit so it OOMs cleanly
      # inside the slice instead of starving the host.
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - portfolio-data:/data/db
    depends_on:
      orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  orchestrator:
    image: ghcr.io/mohith-das/livingcv-orchestrator:latest
    build:
      context: .
      dockerfile: infra/orchestrator.Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    <<: *logging
    environment:
      DATA_DIR: /data/db
      PORTFOLIO_ENCRYPTION_KEY: ${PORTFOLIO_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      JOBOPS_BASE_URL: http://jobops:7891
      JOBOPS_AUTH_TOKEN: ${JOBOPS_AUTH_TOKEN}
      IP_HASH_SALT: ${IP_HASH_SALT}
      ORCHESTRATOR_PORT: 8100
      ORCHESTRATOR_URL: http://orchestrator:8100
      # Master relay MCP is exposed at Caddy's /mcp-admin/*; the SSE transport
      # must advertise that external path for the client's message POSTs.
      MCP_MESSAGES_PATH: /mcp-admin/messages
      NODE_OPTIONS: --max-old-space-size=160
    volumes:
      - portfolio-data:/data/db
    depends_on:
      jobops:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s



  jobops:
    image: ghcr.io/mohith-das/livingcv-jobops:latest
    build:
      context: .
      dockerfile: infra/jobops/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    <<: *logging
    environment:
      JOBOPS_HOST: 0.0.0.0
      JOBOPS_AUTH_TOKEN: ${JOBOPS_AUTH_TOKEN}
      JOBOPS_SCHEDULER_ENABLED: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    volumes:
      - jobops-data:/data
    # Override the image's healthcheck with a longer start_period so `--wait`
    # doesn't abort on slow/small boxes (e.g. 1 GB free tier) during first boot.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7891/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  portfolio-data:
  jobops-data:
  caddy-data:
  caddy-config: