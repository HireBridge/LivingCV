name: portfolio

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      voice:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORTFOLIO_ENCRYPTION_KEY: ${PORTFOLIO_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      JOBOPS_AUTH_TOKEN: ${JOBOPS_AUTH_TOKEN}
      IP_HASH_SALT: ${IP_HASH_SALT}
      ORCHESTRATOR_URL: http://orchestrator:8100
    volumes:
      - portfolio-data:/data
    depends_on:
      orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  orchestrator:
    build:
      context: .
      dockerfile: infra/orchestrator.Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORTFOLIO_ENCRYPTION_KEY: ${PORTFOLIO_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      JOBOPS_BASE_URL: http://jobops:7891
      JOBOPS_AUTH_TOKEN: ${JOBOPS_AUTH_TOKEN}
      IP_HASH_SALT: ${IP_HASH_SALT}
      ORCHESTRATOR_PORT: 8100
      ORCHESTRATOR_URL: http://orchestrator:8100
    volumes:
      - portfolio-data:/data
    depends_on:
      jobops:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  voice:
    build:
      context: ./apps/voice
      dockerfile: ../../infra/voice.Dockerfile
    restart: unless-stopped
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8100
      VOICE_PORT: 8200
      VOICE_WS_PATH: /voice-ws
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  jobops:
    build:
      context: .
      dockerfile: infra/jobops/Dockerfile
    restart: unless-stopped
    environment:
      JOBOPS_HOST: 0.0.0.0
      JOBOPS_AUTH_TOKEN: ${JOBOPS_AUTH_TOKEN}
      JOBOPS_SCHEDULER_ENABLED: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    volumes:
      - jobops-data:/data

volumes:
  portfolio-data:
  jobops-data:
  caddy-data:
  caddy-config:
