name: Build container images

# Builds and pushes the three production images to GHCR. Triggered by a
# successful CI run on main (or manually via workflow_dispatch). The deploy
# workflow (deploy.yml) pulls these images on the box instead of running
# `next build` + 2 more image builds locally — that change is the entire
# point of optimize.md O1: deploys used to take 20–30 minutes on the 1 GB
# free-tier box and risked OOM; with pre-built images they take ~2 minutes.
#
# The image source for jobops is infra/jobops/Dockerfile. It pulls the
# published @mohith_das/jobops package from npm (plus a matching Playwright
# Chromium), so building it here doesn't grant access to anything the
# operator hasn't already published.
#
# Each image is tagged twice: `latest` (used by deploy.yml's `docker compose
# pull`) and the full commit SHA (for reproducibility / rollback). The
# `cache-from/cache-to: type=gha` cache makes rebuilds near-instant on
# cache hits.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Fired by the jobops repo's publish workflow right after `npm publish`
  # succeeds, so a new jobops release rolls onto the box within minutes.
  repository_dispatch:
    types: [jobops-release]
  # Daily fallback: even without the cross-repo dispatch (e.g. the PAT secret
  # is missing or the dispatch failed), the jobops image re-resolves `latest`
  # from npm once a day. If the version is unchanged the resolved build-arg is
  # identical, the install layer cache hits, and the pushed image is a no-op.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: infra/web.Dockerfile
            build_args: |
              GIT_SHA=${{ github.sha }}
          - name: orchestrator
            context: .
            dockerfile: infra/orchestrator.Dockerfile
            build_args: ""
          - name: jobops
            context: .
            dockerfile: infra/jobops/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      # GHCR tags must be lowercase; github.repository_owner isn't guaranteed
      # to be (e.g. an org named "HireBridge").
      - name: Compute lowercase image owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is read-only for forked repos, unconditionally, no
          # matter what this workflow or the repo's Actions settings request
          # — that's a hard-coded GitHub restriction, not a bug here. Anyone
          # running their own deploy fork needs a classic PAT with
          # write:packages, stored as the GHCR_PAT secret; falls back to
          # GITHUB_TOKEN (works fine on non-fork repos like the upstream).
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Resolve the concrete latest jobops version so the Docker install layer
      # is cache-busted exactly when a new version ships (Dockerfile ARG
      # JOBOPS_VERSION). Passed to every matrix build; web/orchestrator don't
      # declare the ARG and simply ignore it (buildx warns, harmless).
      - name: Resolve latest jobops version
        id: jobops
        run: |
          V=$(npm view @mohith_das/jobops version)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "latest @mohith_das/jobops = $V"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/livingcv-${{ matrix.name }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/livingcv-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=livingcv-${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/LivingCV
            org.opencontainers.image.revision=${{ github.sha }}
            dev.livingcv.jobops-version=${{ steps.jobops.outputs.version }}
          build-args: |
            ${{ matrix.build_args }}
            JOBOPS_VERSION=${{ steps.jobops.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max