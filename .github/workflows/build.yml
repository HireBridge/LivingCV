name: Build container images

# Builds and pushes the three production images to GHCR. Triggered by a
# successful CI run on main (or manually via workflow_dispatch). The deploy
# workflow (deploy.yml) pulls these images on the box instead of running
# `next build` + 2 more image builds locally — that change is the entire
# point of optimize.md O1: deploys used to take 20–30 minutes on the 1 GB
# free-tier box and risked OOM; with pre-built images they take ~2 minutes.
#
# The image source for jobops is infra/jobops/Dockerfile, which is read but
# NEVER modified by this workflow (and per the audit-round-3 constraints, it
# must not be). The Dockerfile pulls the patched @mohith_das/jobops package
# from npm, so building it here doesn't grant access to anything the operator
# hasn't already published.
#
# Each image is tagged twice: `latest` (used by deploy.yml's `docker compose
# pull`) and the full commit SHA (for reproducibility / rollback). The
# `cache-from/cache-to: type=gha` cache makes rebuilds near-instant on
# cache hits.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: infra/web.Dockerfile
            build_args: |
              GIT_SHA=${{ github.sha }}
          - name: orchestrator
            context: .
            dockerfile: infra/orchestrator.Dockerfile
            build_args: ""
          - name: jobops
            context: .
            dockerfile: infra/jobops/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/livingcv-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/livingcv-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=livingcv-${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/LivingCV
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max