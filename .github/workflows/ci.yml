name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-flight runs on the same branch / PR when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Node services: lint, typecheck, vitest, and a production build of the
  #    web app. The build catches issues that pure typecheck would miss
  #    (route discovery, serverExternalPackages, …).
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @portfolio/shared
      - run: npm run build -w @portfolio/crypto
      - run: npm run build -w @portfolio/db
      - run: npm run build -w @portfolio/web
      - run: npm run build -w @portfolio/orchestrator

  # 2. Python voice service: ruff + pytest. The voice service ships with
  #    MockSTT/MockTTS so this job runs without any API keys.
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: cd apps/voice
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  # 3. Persona-hardcoding audit (§2 inv 6). Greps apps/ and packages/ for
  #    any of the operator's real name or domain. Fails the build if a
  #    contributor sneaks persona data into source. Allowed only in PLAN.md,
  #    docs/, scripts/seed-demo.ts (the "Alex Rivera" placeholder), and the
  #    open-source jobops repo.
  persona-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Grep for the operator's real name or domain
        run: |
          # Allow in PLAN.md, docs/, seed-demo.ts (the demo), and node_modules.
          if rg -i -n 'mohith|matt[ _-]?das|mattdas\.dev' \
               apps/ packages/ \
               -g '!PLAN.md' -g '!docs/**' -g '!scripts/seed-demo.ts' \
            | grep -v 'node_modules' ; then
            echo "error: real-persona strings found in apps/ or packages/" >&2
            exit 1
          fi
        shell: bash
