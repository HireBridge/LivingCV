[project]
name = "voice-service"
version = "0.2.0"
description = "Portfolio voice service — Pipecat pipeline with real Deepgram/Cartesia/ElevenLabs STT+TTS adapters (cloud) and Whisper/Piper (local); MockSTT/MockTTS for CI."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    # Pipecat — the voice pipeline framework (§8). Marked as a direct dep
    # so the voice service can build a real pipeline with VAD + STT + TTS.
    # pipecat-ai not yet published here as a free dep; the implementations
    # in `pipeline.py` use the same shape and wrap the real adapters directly.
    # When pipecat-ai is installed in the operator's environment, the
    # pipeline.py macros activate.
    "deepgram-sdk>=3.0",
    "cartesia>=1.0",
    "elevenlabs>=1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Phase 5 polish: the local voice path depends on whisper-cpp and piper-tts
# (arm64-compatible). These are optional because they require model files
# downloaded inside the Docker image. Keep them out of the default install
# so the cloud path (Deepgram + Cartesia/ElevenLabs) works without them.
local = [
    "pywhispercpp>=0.2.0",
    "piper-tts>=1.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "UP007"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
