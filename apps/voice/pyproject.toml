[project]
name = "voice-service"
version = "0.2.0"
description = "Portfolio voice service — Pipecat pipeline with SileroVAD + Deepgram/Cartesia/ElevenLabs (cloud) + Whisper/Piper (local) + mock (CI)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    "pipecat-ai[silero,deepgram,cartesia,elevenlabs]>=1.5.0",
    "mlx-whisper[local]>=0.4.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Local voice path (whisper.cpp + Piper): these are optional so the
# cloud path works without them. Add `[local]` when you want to
# activate the keyless STT/TTS stack.
local = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2.0",
]
# Self-hosted WebRTC transport (aiortc). Optional — the voice service
# falls back to Pipecat's Daily transport (documented fallback per
# PLAN §14 risk #2) if this extra is omitted.
webrtc = [
    "aiortc>=1.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "UP007"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that download models (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
